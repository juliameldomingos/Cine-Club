{% extends 'layouts/base_menu.html'%}

{% block titulo %}
Cadastro
{% endblock %}


{% block conteudo %}
<!----TITULO---->

    <div class="container my-5 main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary m-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastro de Filmes</h3>
            <a href="{{ url_for('dashboard') }}" class="btn btn-link text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Voltar para o inicio</a>
        </div>

        <div class="card-form">
            <form action="/filmes" method="POST">
                
            <!--NOME FILME-->

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome do Filme" required>
                            <label for="nome"> Nome do Filme</label>
                        </div>
                    </div>

                <!--LANÇAMENTO-->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="number" class="form-control" id="data_nascimento" name="lancamento" placeholder="Lançamento">
                            <label for="data_nascimento"> Ano de Lançamento</label>
                        </div>
                    </div>

                <!--DURAÇÃO-->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="number" min="1" class="form-control" id="cpf" name="duracao" placeholder="000 min">
                            <label for="cpf"> Duração (Min)</label>
                        </div>
                    </div>

            <!--CATEGORIA-->

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="categoria_filme" name="categoria_filme">
                                <option value="" selected>Selecione uma categoria...</option>
                                <option value="Ação">Ação</option>
                                <option value="Comédia">Comédia</option>
                                <option value="Drama">Drama</option>
                                <option value="Ficção Científica">Ficção Científica</option>
                                <option value="Romance">Romance</option>
                                <option value="Infantil">Infantil</option>
                                <option value="Terror">Terror</option>
                                <option value="Suspense">Suspense</option>
                            </select>
                            <label for="categoria_filme"> Categoria</label>
                        </div>
                    </div>

            <!----BOTOES DO FINAL---->


                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="reset" class="btn btn-clear">
                         Limpar
                    </button>
                    <button type="submit" class="btn btn-save">
                         Salvar Cadastro
                    </button>
                </div>

            </form>
        </div>
    </div>

{% endblock %}
