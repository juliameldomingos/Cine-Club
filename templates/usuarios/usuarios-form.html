{% extends 'layouts/base_menu.html'%}

{% block titulo %}
Cadastro
{% endblock %}


{% block conteudo %}

<!-- TITULO PARTE DE CIMA-->

    <div class="container my-5 main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary m-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastro de Usuários</h3>
            <a href="{{ url_for('dashboard') }}" class="btn btn-link text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Voltar para o inicio</a>
        </div>

        <div class="card-form">
            <form action="/inserir_usuarios" method="POST">
                
            <!----NOME COMPLETO---->
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome Completo" required>
                            <label for="nome"> Nome Completo</label>
                        </div>
                    </div>

            <!----EMAIL---->

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                            <label for="email"> Email</label>
                        </div>
                    </div>

            <!----CELULAR---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="celular" name="celular" placeholder="(00) 00000-0000">
                            <label for="celular"> Celular</label>
                        </div>
                    </div>

            <!----DATA DE NASCIMENTO---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" placeholder="Data de Nascimento">
                            <label for="data_nascimento"> Date de Nascimento</label>
                        </div>
                    </div>

            <!----CPF---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00">
                            <label for="cpf"></i> CPF</label>
                        </div>
                    </div>

                <!----NÍVEL DE ACESSO---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="nivel_acesso" name="nivel_acesso">
                                <option value="" selected>Selecione...</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Usuario">Usuário</option>
                            </select>
                            <label for="nivel_acesso"> Acesso</label>
                        </div>
                    </div>
                </div>
                
                <!----CEP---->

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000">
                            <label for="cep">CEP</label>
                        </div>
                    </div>

                <!----RUA---->

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, Avenida...">
                            <label for="endereco">Endereço</label>
                        </div>
                    </div>

                <!----NÚMERO---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="numero" name="numero" placeholder="Número">
                            <label for="numero">Número</label>
                        </div>
                    </div>

                <!----COMPLEMENTO---->

                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="complemento" name="complemento" placeholder="Apt, Bloco...">
                            <label for="complemento">Complemento</label>
                        </div>
                    </div>

                <!----CIDADE---->

                    <div class="col-md-5">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Cidade">
                            <label for="cidade">Cidade</label>
                        </div>
                    </div>

                <!----ESTADO---->

                    <div class="col-md-3">
                        <div class="form-floating">
                            <select class="form-select" id="estado" name="estado">
                                <option value="" selected>Selecione...</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                            </select>
                            <label for="estado">Estado</label>
                        </div>
                    </div>
                </div>

                <!----BOTOES DO FINAL---->

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="reset" class="btn btn-clear">
                         Limpar
                    </button>
                    <button type="submit" class="btn btn-save">
                         Salvar Cadastro
                    </button>
                </div>

            </form>
        </div>
    </div>


{% endblock %}
